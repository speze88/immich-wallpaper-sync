name: Build release binary

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o dist/immich-wallpaper-sync .

      - name: Package binary and create checksum
        run: |
          cp README.md LICENSE dist/
          tar -C dist -czf dist/immich-wallpaper-sync-linux-amd64.tar.gz immich-wallpaper-sync README.md LICENSE
          cd dist
          sha256sum immich-wallpaper-sync-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/immich-wallpaper-sync-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
